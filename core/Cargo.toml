[package]
name = "shruti-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "chrono", "uuid"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "rt-multi-thread", "macros", "fs", "io-util", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
wiremock = "0.6.5"
