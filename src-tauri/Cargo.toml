[package]
name = "shruti-app"
description = "Shruti: links to clean Obsidian notes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
shruti-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.2", features = ["macros", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
